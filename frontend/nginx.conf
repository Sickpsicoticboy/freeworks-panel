server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: rutas de Angular caen a index.html (rewrite)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy de API al backend Django (nombre de servicio en docker-compose)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
    }
}
